name: content-guard

# This repository is PUBLIC. These checks fail the build if source ever carries
# secrets, personal contact details, or proprietary scoring internals.

# Runs on every branch and every pull request, not only on main. A guard that
# only runs after the merge reports a breach instead of preventing one.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # THE ACTION WRAPPER IS LICENSED FOR ORGANISATIONS AND THE TOOL IS NOT.
      #
      # `gitleaks/gitleaks-action@v2` is free on a personal account and demands a paid
      # GITLEAKS_LICENSE once the repository belongs to an organisation. Moving the estate into
      # `Marga-Partners` on 2026-09-05 therefore turned the only secret scanning in the estate off,
      # and it announced that by failing rather than by passing, which is the one mercy in it.
      #
      # gitleaks itself is MIT licensed and free. Only the wrapper gates. So this runs the released
      # binary directly: same engine, same rules, same exit code, no licence and no third party
      # action holding a token. Pinned by version and verified by checksum, because a scanner
      # fetched over the network is a supply chain step and `curl | tar` from a moving `latest` is
      # exactly the pattern this file exists to catch elsewhere.
      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
          # --redact so a finding never prints the secret into a public build log.
          ./gitleaks detect --source . --redact --no-banner --exit-code 1

  content:
    name: PII and proprietary-value scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Personal contact details must never appear in public source. The firm
      # addresses (admin@ / studio@ / aneesh@margapartners.com) are allowed.
      - name: No personal email addresses
        run: |
          if grep -rInE '[A-Za-z0-9._%+-]+@(gmail|yahoo|hotmail|outlook|icloud|aol|proton(mail)?)\.[A-Za-z]{2,}' \
               --exclude-dir=.git --exclude-dir=.github --exclude-dir=.githooks . ; then
            echo "::error::A personal email address is present in public source. Use a margapartners.com address."
            exit 1
          fi
          echo "OK: no personal email addresses."

      # The calibrated band cutoffs live server-side in the scoring engine and
      # must not be encoded in public illustrations. Public demos use even thirds.
      - name: No calibrated band cutoffs in scoring illustrations
        run: |
          if grep -rInE '(>=|>|<=|<)[[:space:]]*(40|70)[[:space:]]*\?' \
               --include='*.html' --include='*.js' \
               --exclude-dir=.git --exclude-dir=.github --exclude-dir=.githooks \
               --exclude-dir=journal --exclude-dir=refractions --exclude-dir=essays . ; then
            echo "::error::A band comparison uses a calibrated cutoff (40/70). Use the illustrative BAND_LO/BAND_HI thirds."
            exit 1
          fi
          echo "OK: no calibrated cutoffs."

      # A lens weight matrix is a table of calibration constants. One shipped in
      # this repo's history inside a playbook page and was only caught during
      # WO-2, because the earlier checks looked for identifiers and cutoffs, not
      # for a row of decimals sitting next to a lens name.
      - name: No lens weight matrix
        run: node .github/scripts/check-weight-matrix.mjs

      # Real lens weight vectors and engine identifiers belong to the private
      # p5-studio repo only.
      - name: No engine internals
        run: |
          if grep -rInE 'BAND_THRESHOLDS|LENSES_REF|headlineGamma|perceptionGapThreshold|strongMultiple|reconcileThreshold|socialDirectionThreshold|momentumFloorK|lenses\.data\.json' \
               --exclude-dir=.git --exclude-dir=.github --exclude-dir=.githooks . ; then
            echo "::error::A private scoring-engine identifier appears in public source."
            exit 1
          fi
          echo "OK: no engine internals."

      - name: Product naming guard
        # Four marks, no strays. A retired product name fails the build, which is
        # what stops the rename from regressing one commit at a time.
        run: node bin/naming-check.js

      - name: Corpus embargo
        # No public page may state a corpus grade or corpus membership while two assessors are
        # being asked for a judgement blind to those outcomes. Lifts when both seals exist.
        run: node bin/embargo-check.js

      - name: Adjacent section grounds
        # Never two identical grounds side by side. The same rule the printed documents have
        # asserted since the 2026-08-18 brief, now asserted for the site: for-providers.html ran
        # the advisory prose and the join gate on one colour and read as a single slab.
        run: node bin/ground-check.js
